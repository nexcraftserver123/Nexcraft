const FAQ=[['¿Qué son los NexCoins?','Es la moneda oficial del servidor, con valores de 2 a 3.000 NC. La economía premia explorar estructuras y conseguir objetos únicos.'],['¿Qué pasa si no declaro mi nivel de bromas?','Se aplica el Nivel 1 (Básico). Puedes declarar el tuyo con un letrero visible en tu base o en el canal #niveles-de-bromas.'],['¿Puedo cambiar mi nivel después?','Sí. Puedes subir, bajar o retirar tu nivel cuando quieras, y el cambio vale hacia adelante.'],['¿Y si alguien me pide que pare una broma?','Hay que parar de inmediato, en cualquier nivel. Ningún nivel permite acoso, datos privados, hacks, bugs, spawnkill ni afectar zonas públicas.']];
const rar=p=>p>=1000?['Legendario','--y']:p>=300?['Épico','--vi']:p>=100?['Raro','--b']:['Común','--mu'];
let ef='all',lvl=0;
function eco(){const g=$('#eg');if(!g)return;const q=($('#q').value||'').toLowerCase().trim(),so=$('#so').value;
let l=IT.map(([n,d],i)=>({n,i,p:S.prices?.[n]??d,ore:i>=14})).filter(x=>(ef==='all'||(ef==='ore')===x.ore)&&x.n.toLowerCase().includes(q));
l.sort(so==='az'?(x,y)=>x.n.localeCompare(y.n):so==='lo'?(x,y)=>x.p-y.p:(x,y)=>y.p-x.p);
g.innerHTML=l.map(x=>{const r=rar(x.p);return `<div class="it" style="--c:var(${r[1]})"><img src="${IC[x.i]}" alt="" width="56" height="56"><span class="nm">${esc(x.n)}</span><b class="pp">${nc(x.p)}</b><small>${r[0]}</small></div>`}).join('')||'<p class="sub">Ningún objeto coincide con tu búsqueda.</p>';
document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===ef))}
function sel(i){lvl=i;document.querySelectorAll('.lvl').forEach((c,j)=>c.classList.toggle('on',j===i));const p=$('#lp');if(p)p.innerHTML=`<b>Nivel ${i+1} · ${LV[i][0]}</b><ul>${LV.slice(0,i+1).map((l,j)=>`<li><b>Nivel ${j+1}:</b> ${l[1]}</li>`).join('')}</ul><p style="margin:10px 0 0;color:var(--mu)">Cada nivel incluye todo lo permitido en los anteriores.</p>`}
function render(){const a=S.server||{},t=today(),up=EV.filter(e=>(e.ends_on||e.starts_on)>=t),past=EV.filter(e=>(e.ends_on||e.starts_on)<t).reverse();
$('#an').innerHTML=(a.maint?['Servidor en mantenimiento.']:[]).concat(S.announcements||[]).map(x=>`<div class="ann">${esc(x)}</div>`).join('');
const nav=(p,e,h,d,c)=>`<a class="card" href="#${p}" onclick="go('${p}');return false" style="--c:var(${c})"><div class="em">${e}</div><h3 style="color:var(${c})">${h}</h3><p>${d}</p></a>`;
$('#pub').innerHTML=`<main data-p="inicio"><div class="hero"><img class="logo" src="${LOGO}" alt="Logotipo de NexCraft"><h1>NexCraft</h1><p class="lead">Un servidor de Minecraft donde tú decides cuánta broma aceptas en tu base.</p><div class="ip">${a.ip?`<button class="p" id="ipb" onclick="cp()">${esc(a.ip)}</button>`:'<span class="st">IP próximamente</span>'}<span id="stt" class="st"></span>${a.disc?`<a class="btn" href="${esc(a.disc)}" target="_blank" rel="noopener">Discord</a>`:''}<a class="btn p" href="#postular" onclick="go('postular');return false">Postular</a></div><div class="cd" id="cd"></div></div>
<div class="stats"><div class="card"><b id="stp">—</b><span>Jugadores</span></div><div class="card"><b>${esc(a.ver||'Java')}</b><span>Versión</span></div><div class="card"><b>2–3.000</b><span>Rango de NexCoins</span></div><div class="card"><b>5</b><span>Niveles de broma</span></div></div>
<section><h2>Cómo empezar</h2><br><div class="lv steps"><div class="card"><div class="em">1</div><h3>Copia la IP</h3><p>Añade el servidor en Minecraft con la IP de arriba y entra.</p></div><div class="card"><div class="em">2</div><h3>Declara tu nivel</h3><p>Elige cuánta broma aceptas en tu base y avisa con un letrero o en Discord.</p></div><div class="card"><div class="em">3</div><h3>Explora y gana</h3><p>Encuentra estructuras y objetos únicos para ganar NexCoins.</p></div></div></section>
<section><h2>Lo que hace diferente a NexCraft</h2><br><div class="lv">${nav('economia','🪙','Economía propia','NexCoins y objetos únicos con valor real.','--y')}${nav('niveles','🎭','Tú pones el límite','Cinco niveles de consentimiento de bromas.','--pk')}${nav('eventos','🏆','Eventos y noticias','Mira qué se viene en el servidor.','--b')}</div></section>
<section><h2>Últimas noticias</h2><br>${ok?news(NW.slice(0,3)):'<p class="sub">No se pudo cargar el contenido. Inténtalo más tarde.</p>'}</section>
<section><h2>Preguntas frecuentes</h2><br>${FAQ.map(([q,r])=>`<details><summary>${q}</summary><p>${r}</p></details>`).join('')}</section></main>
<main data-p="noticias"><section><h2>Noticias</h2><br>${news(NW)}</section></main>
<main data-p="eventos"><section><h2>Eventos</h2><br>${evs(up)||'<p class="sub">Pronto publicaremos los eventos de la temporada. ¡Atento al Discord!</p>'}${past.length?'<h3 style="margin:24px 0 12px">Anteriores</h3>'+evs(past):''}</section></main>
<main data-p="economia"><section><h2>Economía</h2><p class="sub">Moneda oficial: NexCoins (NC). La economía premia explorar estructuras y conseguir objetos únicos. El color de cada objeto indica su rareza según el precio.</p>
<div class="tools"><input id="q" type="search" placeholder="Buscar objeto…" aria-label="Buscar objeto" oninput="eco()"><div class="chips"><button class="chip" data-f="all" onclick="ef='all';eco()">Todos</button><button class="chip" data-f="rare" onclick="ef='rare';eco()">Artefactos</button><button class="chip" data-f="ore" onclick="ef='ore';eco()">Minerales</button></div><select id="so" aria-label="Ordenar" onchange="eco()"><option value="hi">Mayor precio</option><option value="lo">Menor precio</option><option value="az">A–Z</option></select></div>
<div class="eg" id="eg"></div><div class="note">Los minerales tienen valores bajos para evitar la hiperinflación de las granjas automáticas y los túneles masivos.</div></section></main>
<main data-p="postular"><section><h2>Postulación</h2><p class="sub">NexCraft es un SMP vanilla con filtro de ingreso. Completa tus datos y responde el examen: 20 preguntas basadas en las normas, la economía de intercambio y los niveles de consentimiento. Repasa las secciones Economía y Niveles antes de empezar.</p>
<form id="pf" onsubmit="sendApp(event)"><div class="fm"><label>Usuario de Minecraft<input id="pu" required maxlength="16" pattern="[A-Za-z0-9_]{3,16}" autocomplete="off"></label><label>Usuario de Discord<input id="pd" required maxlength="40" autocomplete="off"></label><label>Edad<input id="pa" type="number" min="8" max="99"></label></div>
<label>Experiencia en SMP (opcional)<textarea id="pe" rows="3" maxlength="1000"></textarea></label><br>
<label>¿Por qué quieres entrar a NexCraft?<textarea id="pt" rows="4" required minlength="20" maxlength="1500"></textarea></label>
<div class="hp" aria-hidden="true"><label>Web<input id="pw" tabindex="-1" autocomplete="off"></label></div>
<h3 style="margin:28px 0 12px">Examen de admisión (20 preguntas)</h3><div id="qs"></div>
<p><button class="p" id="pb">Enviar postulación</button></p><div id="pm" role="alert"></div></form></section></main>
<main data-p="niveles"><section><h2>Niveles de consentimiento</h2><p class="sub">Tú decides cuánta broma aceptas en tu base. Los demás deben respetarlo. Toca un nivel para ver qué incluye.</p><div class="lv">${LV.map((l,i)=>`<div class="card lvl" role="button" tabindex="0" onclick="sel(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();sel(${i})}" style="--c:var(${l[2]})"><div class="em">${l[3]}</div><h3>Nivel ${i+1}</h3><small style="color:var(--c)">${l[0]}</small><p>${l[1]}</p><div class="pips">${[0,1,2,3,4].map(j=>`<s class="${j<=i?'f':''}"></s>`).join('')}</div></div>`).join('')}</div><div class="note" id="lp"></div><div class="note">Sin declaración se aplica el Nivel 1. Si alguien pide parar, se para de inmediato. Ningún nivel permite acoso, datos privados, hacks, bugs, spawnkill ni afectar zonas públicas.</div></section></main>`;eco();sel(lvl);tick();postForm();route()}
function postForm(){const q=$('#qs');if(!q)return;q.innerHTML=EXAM.map((x,i)=>`<fieldset class="qq"><legend><b>${i+1}.</b> ${esc(x.q)}</legend>${['A','B','C','D'].map((l,j)=>`<label class="op"><input type="radio" name="q${i}" value="${l}"><span><b>${l})</b> ${esc(x.o[j])}</span></label>`).join('')}</fieldset>`).join('')}
async function sendApp(e){e.preventDefault();const m=$('#pm'),btn=$('#pb');let a='';
for(let i=0;i<EXAM.length;i++){const c=document.querySelector(`input[name=q${i}]:checked`);if(!c){m.textContent=`Falta responder la pregunta ${i+1}.`;m.className='bad';return}a+=c.value}
const v=id=>$(id).value.trim();btn.disabled=true;m.className='';m.textContent='Enviando…';
const {data,error}=await sb.functions.invoke('submit-application',{body:{mc:v('#pu'),discord:v('#pd'),age:v('#pa'),experience:v('#pe'),motivation:v('#pt'),answers:a,website:v('#pw')}});
if(error||(data&&data.error)){let t='No se pudo enviar. Inténtalo de nuevo.';try{if(error)t=(await error.context.json()).error||t}catch(x){}if(data&&data.error)t=data.error;m.textContent=t;m.className='bad';btn.disabled=false;return}
$('#pf').innerHTML='<div class="note"><b>¡Postulación enviada!</b><br>El staff revisará tu examen y te escribirá por Discord. No hace falta enviarla otra vez.</div>'}
const OPEN_DEFAULT='2027-01-01T00:00:00-05:00';
const openAt=()=>{const d=new Date((S.server||{}).opening||OPEN_DEFAULT);return isNaN(d)?new Date(OPEN_DEFAULT):d};
function tick(){const e=$('#cd');if(!e)return;const o=openAt(),t=o-Date.now();
if(t<=0){e.innerHTML='<small>¡La gran apertura ya comenzó!</small>';return}
const f=new Intl.DateTimeFormat('es',{day:'numeric',month:'long',year:'numeric'}).format(o),n=Math.floor(t/1e3),
v=[['Días',Math.floor(n/86400)],['Horas',Math.floor(n%86400/3600)],['Min',Math.floor(n%3600/60)],['Seg',n%60]];
e.innerHTML=`<small>Gran apertura · ${f}</small><div class="cdg" role="timer" aria-label="Cuenta regresiva para la apertura">${v.map(([l,x])=>`<div><b>${String(x).padStart(2,'0')}</b><span>${l}</span></div>`).join('')}</div>`}
setInterval(tick,1000);
function route(){document.querySelectorAll('#pub main').forEach(x=>x.hidden=x.dataset.p!==pg);document.querySelectorAll('header a').forEach(a=>a.classList.toggle('on',a.hash==='#'+pg))}
function go(p){pg=p;try{location.hash=p}catch(e){}route();scrollTo(0,0)}
addEventListener('hashchange',()=>{pg=location.hash.slice(1)||'inicio';route()});
async function live(){const e=$('#stt'),a=S.server||{};if(!e||!a.ip)return;try{const d=await(await fetch('https://api.mcsrvstat.us/3/'+encodeURIComponent(a.ip))).json();if(d.online===undefined)return;e.className='st'+(d.online?' on':'');e.textContent=d.online?`En línea · ${d.players?.online??0}/${d.players?.max??a.max} jugadores`:'Fuera de línea';const p=$('#stp');if(p)p.textContent=d.online?`${d.players?.online??0}/${d.players?.max??a.max}`:'Offline'}catch(x){}}
function cp(){const b=$('#ipb'),t=S.server.ip;try{navigator.clipboard.writeText(t)}catch(e){}b.textContent='IP copiada';setTimeout(()=>b.textContent=t,1500)}
load();
</script></body></html>
